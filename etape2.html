<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR-Démineur — Étape 2</title><style>body{font-family:system-ui,sans-serif;background:#f3f0e9;margin:0;padding:20px;color:#222}main{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:14px}h1,p{text-align:center}#b{display:grid;grid-template-columns:repeat(14,32px);gap:2px;justify-content:center;overflow:auto}button.x{width:32px;height:32px;border:1px solid #888;background:#ddd;font-weight:700}button.o{background:#fafafa}button.m{background:#000}button.boom{background:#d44}#s{text-align:center;font-weight:700;margin:14px}.n1{color:#1458c8}.n2{color:#17803a}.n3{color:#c33}.n4{color:#513097}</style></head><body><main><h1>QR-Démineur — ÉTAPE 2</h1><p>Clic gauche : ouvrir · clic droit : drapeau. Ouvrez toutes les cases sans mine.</p><div id="b"></div><div id="s">Bonne chance !</div><p><button id="r">Recommencer</button></p></main><script>(()=>{const R=15,C=14,D=[0, 4350, 2690, 698, 698, 4282, 5250, 2814, 512, 1850, 5664, 4048, 2908, 4760, 0],W="Bien joué ! Conserve ce motif ! Il te servira plus tard...";const M=D.map(n=>n.toString(2).padStart(C,'0').split('').map(x=>x==='1'));let O,F,E,A;const B=document.getElementById('b'),S=document.getElementById('s');function N(r,c){let a=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++)if((x||y)&&r+y>=0&&r+y<R&&c+x>=0&&c+x<C)a.push([r+y,c+x]);return a}function Cn(r,c){return N(r,c).reduce((s,[y,x])=>s+(M[y][x]?1:0),0)}function rev(win){for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(M[r][c])A[r][c].classList.add('m');if(win){S.textContent=W;S.style.background='#e6f7e6'}}function open(r,c){if(E||O[r][c]||F[r][c])return;if(M[r][c]){E=1;A[r][c].classList.add('boom');S.textContent='Boum ! Recommence.';return}let q=[[r,c]];while(q.length){let [y,x]=q.pop();if(O[y][x]||F[y][x]||M[y][x])continue;O[y][x]=1;let e=A[y][x];e.classList.add('o');let n=Cn(y,x);if(n){e.textContent=n;e.classList.add('n'+n)}else for(let z of N(y,x))if(!O[z[0]][z[1]]&&!M[z[0]][z[1]])q.push(z)}let left=0;for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(!M[y][x]&&!O[y][x])left++;if(!left){E=1;rev(1)}}function init(){B.innerHTML='';O=Array.from({length:R},()=>Array(C).fill(0));F=Array.from({length:R},()=>Array(C).fill(0));A=Array.from({length:R},()=>Array(C));E=0;S.textContent='Bonne chance !';S.style.background='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){let e=document.createElement('button');e.className='x';e.onclick=()=>open(r,c);e.oncontextmenu=v=>{v.preventDefault();if(!E&&!O[r][c]){F[r][c]=!F[r][c];e.textContent=F[r][c]?'⚑':''}};B.appendChild(e);A[r][c]=e}}document.getElementById('r').onclick=init;init()})();</script></body></html>
